# .github/workflows/pr-summary.yml
name: Auto PR Summary

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      models: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and write summary
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            // 读取 copilot-instructions.md
            let instructions = '';
            try {
              instructions = fs.readFileSync('.github/copilot-instructions.md', 'utf8');
            } catch (e) {
              core.info('未找到 copilot-instructions.md，使用默认行为');
            }

            // 获取 diff
            let diff = '';
            try {
              diff = execSync(
                'git diff origin/${{ github.base_ref }}...HEAD -- . ":(exclude)*.lock" ":(exclude)package-lock.json"',
                { maxBuffer: 1024 * 1024 }
              ).toString().slice(0, 6000);
            } catch (e) {
              core.warning('获取 diff 失败：' + e.message);
              return;
            }

            if (!diff.trim()) return;

            const response = await fetch('https://models.github.ai/inference/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model: 'openai/gpt-4o-mini',
                max_tokens: 800,
                messages: [
                  {
                    role: 'system',
                    content: `你是一个代码审查助手，请根据以下项目规范生成 PR 摘要：\n\n${instructions}`
                  },
                  {
                    role: 'user',
                    content: `PR 标题：${{ github.event.pull_request.title }}\n\nDiff：\n${diff}`
                  }
                ]
              })
            });

            const data = await response.json();
            const summary = data.choices?.[0]?.message?.content;
            if (!summary) return;

            const START = '<!-- auto-summary-start -->';
            const END = '<!-- auto-summary-end -->';

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const existing = pr.data.body || '';
            const block = `${START}\n${summary}\n${END}`;
            const newBody = existing.includes(START)
              ? existing.replace(new RegExp(`${START}[\\s\\S]*?${END}`), block)
              : `${block}\n\n---\n\n${existing}`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: newBody,
            });