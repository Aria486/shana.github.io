# .github/workflows/pr-summary.yml
name: Auto PR Summary

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      models: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and write summary
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            // 读取 copilot-instructions.md，只取 SECTION: PR 部分
            let instructions = '';
            try {
              const fullInstructions = fs.readFileSync('.github/copilot-instructions.md', 'utf8');
              const prSectionMatch = fullInstructions.match(/# \[SECTION: PR\][\s\S]*/);
              instructions = prSectionMatch ? prSectionMatch[0] : fullInstructions;
            } catch (e) {
              core.info('未找到 copilot-instructions.md，使用默认行为');
            }

            // 获取 diff
            let diff = '';
            try {
              diff = execSync(
                'git diff origin/${{ github.base_ref }}...HEAD -- . ":(exclude)*.lock" ":(exclude)package-lock.json"',
                { maxBuffer: 1024 * 1024 }
              ).toString().slice(0, 6000);
            } catch (e) {
              core.warning('获取 diff 失败：' + e.message);
              return;
            }

            if (!diff.trim()) {
              core.info('没有检测到代码变更，跳过摘要生成');
              return;
            }

            const response = await fetch('https://models.github.ai/inference/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model: 'openai/gpt-4.1',
                max_tokens: 1200,
                messages: [
                  {
                    role: 'system',
                    content: `你是一个代码审查助手，请根据 git diff 生成 PR 描述。以下是项目的 PR 规范，请严格遵守：\n\n${instructions}\n\n额外要求：\n- 不要输出模板中 <!-- --> 内的提示文字\n- Breaking Changes 和关联 Issue 如无相关信息，直接填"无"\n- 全程使用简体中文`
                  },
                  {
                    role: 'user',
                    content: `PR 标题：${{ github.event.pull_request.title }}\n\nDiff：\n${diff}`
                  }
                ]
              })
            });

            if (!response.ok) {
              core.warning(`GitHub Models 调用失败：${response.status} ${await response.text()}`);
              return;
            }

            const data = await response.json();
            const summary = data.choices?.[0]?.message?.content;

            if (!summary) {
              core.warning('返回内容为空');
              return;
            }

            // 写入 PR 描述，用注释标记区分自动和手动内容
            const START = '<!-- auto-summary-start -->';
            const END = '<!-- auto-summary-end -->';

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const existing = pr.data.body || '';
            const block = `${START}\n${summary}\n${END}`;

            const newBody = existing.includes(START)
              ? existing.replace(new RegExp(`${START}[\\s\\S]*?${END}`), block)
              : `${block}\n\n---\n\n${existing}`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: newBody,
            });

            core.info('✅ 中文摘要已写入 PR 描述');