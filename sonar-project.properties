# 项目基本信息
sonar.projectKey=sonarQube-test-project
sonar.projectName=SonarQube-Test-Project
sonar.projectVersion=1.0

# 源码目录
sonar.sources=src
sonar.sourceEncoding=UTF-8

# 排除文件
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/public/**,**/*.test.js,**/*.test.ts,**/*.test.tsx,**/*.spec.js,**/*.spec.ts,**/*.spec.tsx

# 测试目录 (如果有的话)
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.ts,**/*.test.tsx,**/*.spec.js,**/*.spec.ts,**/*.spec.tsx

# 覆盖率报告路径 (如果有测试覆盖率)
sonar.javascript.lcov.reportPaths=coverage/lcov.info